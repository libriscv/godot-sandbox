name: Release
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: godot-sandbox-*
          merge-multiple: true
          path: godot-sandbox
          name: godot-sandbox
      - name: Download artifacts JIT
        uses: actions/download-artifact@v4
        with:
          pattern: godot-jit-*
          merge-multiple: true
          path: sandbox
          name: godot-jit
      - name: Download GDScript compiler ELF
        uses: actions/download-artifact@v4
        with:
          name: godot-sandbox-gdscript-elf
          path: .
      - name: Delete draft release(s)
        uses: hugo19941994/delete-draft-releases@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive
        shell: sh
        run: |
          mkdir -p godot-jit
          mv sandbox/libgodot_riscv.* godot-jit/
          # SafeGDScript looks for the compiler at res://addons/godot_sandbox/gdscript.elf
          mv godot-sandbox/gdscript.elf godot-sandbox/addons/godot_sandbox/gdscript.elf
          # The asset store requires the license inside the addon directory,
          # not at the zip root: a root-level copy is what got v0.50 denied
          cp LICENSE THIRDPARTY.txt godot-sandbox/addons/godot_sandbox/
          cp LICENSE THIRDPARTY.txt godot-jit/
          # addons/ at the zip root, nothing above it: bin/ doubles as a test
          # project, and naming addons explicitly leaves its scaffolding behind
          (cd godot-sandbox && zip -r ../godot-sandbox.zip addons)
          zip -r "godot-sandbox-jit.zip" godot-jit
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Godot Sandbox Nightly
          files: |
            godot-sandbox.zip
            godot-sandbox-jit.zip
            gdscript.elf
          tag_name: nightly
          generate_release_notes: true
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
